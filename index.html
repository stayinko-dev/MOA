div>${x.video?`<video class="post-video" src="${x.video}" controls playsinline loop preload="metadata"></video>`:x.fileImage?`<img class="post-img" src="${x.fileImage}" loading="lazy">`:x.img?`<img class="post-img" src="${image(x.img)}" loading="lazy">`:''}<div class="post-actions"><button class="action" onclick="like(this)"><b>♡</b><span>${x.likes}</span></button><button class="action" onclick="toast('댓글을 남겨보세요 💬')"><b>◯</b><span>${x.comments}</span></button><button class="action" onclick="toast('이야기를 다시 모았어요')"><b>⟳</b><span>다시모음</span></button><button class="action" onclick="toast('링크를 복사했어요')"><b>↗</b></button></div></article>`).join('')};function renderStories(){document.querySelector('#stories').innerHTML=`<div class="story"><div class="ring add"><span>＋</span></div>내 스토리</div>`+people.map(p=>`<div class="story"><div class="ring"><img src="${p[2]}"></div>${p[0]}</div>`).join('')};function renderGrid(sel){sel.innerHTML=pics.map(id=>`<img src="${image(id)}" loading="lazy">`).join('')};const communities=[{cat:'언어교환',emoji:'🗣️',name:'오늘의 언어친구',desc:'한국어와 영어, 편하게 대화하며 서로의 표현을 배워요.',members:2840,activity:'오늘 36명이 이야기했어요'},{cat:'여행',emoji:'✈️',name:'주말엔 어디로?',desc:'가까운 나들이부터 버킷리스트 여행까지 함께 나눠요.',members:6310,activity:'새 여행 기록 12개'},{cat:'요리',emoji:'🍳',name:'오늘 뭐 먹지?',desc:'집밥 레시피와 맛있는 식당을 추천하는 모임이에요.',members:4120,activity:'레시피 이야기 활발해요'},{cat:'뷰티',emoji:'🧴',name:'나만의 뷰티 루틴',desc:'피부 관리와 메이크업 팁을 부담 없이 공유해요.',members:3780,activity:'오늘의 루틴 24개'},{cat:'피트니스',emoji:'💪',name:'같이 움직이는 하루',desc:'운동 인증과 작은 목표를 서로 응원해요.',members:5290,activity:'이번 주 챌린지 진행 중'}];function renderCommunities(category='전체'){let list=category==='전체'?communities:communities.filter(c=>c.cat===category);document.querySelector('#communityList').innerHTML=list.map((c,i)=>`<article class="community-card"><div class="community-top"><div class="community-emoji">${c.emoji}</div><div><div class="community-title">${c.name}</div><div class="community-category">${c.cat} 커뮤니티</div></div><button class="community-join" onclick="joinCommunity(this,${i})">참여하기</button></div><div class="community-desc">${c.desc}</div><div class="community-foot"><span>👥 <b class="member-count">${c.members.toLocaleString()}명</b></span><span>${c.activity}</span></div></article>`).join('')}function joinCommunity(b,i){let joined=b.classList.toggle('joined');b.textContent=joined?'참여 중':'참여하기';let c=communities.find(x=>x.name===b.closest('.community-card').querySelector('.community-title').textContent);if(c)c.members+=joined?1:-1;b.closest('.community-card').querySelector('.member-count').textContent=c.members.toLocaleString()+'명';toast(joined?'커뮤니티에 참여했어요 🙌':'커뮤니티 참여를 취소했어요')}function like(b){b.classList.toggle('liked');let n=b.querySelector('span');n.textContent=+n.textContent+(b.classList.contains('liked')?1:-1);b.querySelector('b').textContent=b.classList.contains('liked')?'♥':'♡'}function follow(b){b.textContent=b.textContent==='팔로우'?'팔로잉':'팔로우';b.style.color=b.textContent==='팔로잉'?'#999':'var(--coral)'}function nav(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle('selected',b.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}let selectedMedia=null,selectedMediaUrl=null;function openComposer(){document.querySelector('#modalBg').classList.add('open');setTimeout(()=>document.querySelector('#draft').focus(),100)}function closeComposer(){document.querySelector('#modalBg').classList.remove('open')}function chooseMedia(type){let input=document.querySelector('#mediaInput');input.accept=type;input.click()}function selectMedia(e){let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){toast('사진 또는 영상 파일을 선택해 주세요');return}if(selectedMediaUrl)URL.revokeObjectURL(selectedMediaUrl);selectedMedia=file;selectedMediaUrl=URL.createObjectURL(file);let box=document.querySelector('#mediaPreview');box.innerHTML=file.type.startsWith('video/')?`<video src="${selectedMediaUrl}" controls muted playsinline></video><button class="remove-media" onclick="clearMedia()">×</button>`:`<img src="${selectedMediaUrl}" alt="선택한 사진 미리보기"><button class="remove-media" onclick="clearMedia()">×</button>`;box.classList.add('show')}function clearMedia(){if(selectedMediaUrl)URL.revokeObjectURL(selectedMediaUrl);selectedMedia=null;selectedMediaUrl=null;document.querySelector('#mediaPreview').classList.remove('show');document.querySelector('#mediaPreview').innerHTML='';document.querySelector('#mediaInput').value=''}function publishPost(){let t=document.querySelector('#draft').value.trim();if(!t&&!selectedMedia){toast('이야기를 적거나 사진·숏폼 영상을 선택해 주세요');return}let post={p:0,text:t,likes:0,comments:0,time:'방금'};if(selectedMedia?.type.startsWith('video/'))post.video=selectedMediaUrl;else if(selectedMedia)post.fileImage=selectedMediaUrl;posts.unshift(post);renderFeed();document.querySelector('#draft').value='';selectedMedia=null;selectedMediaUrl=null;document.querySelector('#mediaInput').value='';document.querySelector('#mediaPreview').innerHTML='';document.querySelector('#mediaPreview').classList.remove('show');closeComposer();nav('home');toast('새 이야기를 모도에 게시했어요 ✨')}let settingsView='root';const settingsGroups=[{title:'계정',items:[['account','👤','계정 센터','비밀번호, 개인정보 및 연결 경험'],['privacy','🔒','개인정보 보호','비공개 계정, 활동 상태 관리'],['security','🛡️','보안','로그인 알림 및 계정 보호']]},{title:'사용 방식',items:[['notifications','🔔','알림','푸시 및 앱 알림 설정'],['activity','◷','보관 및 활동','보관된 게시물과 내 활동 보기'],['preferences','✳','콘텐츠 환경설정','추천 콘텐츠와 숨길 단어 관리']]},{title:'지원 및 정보',items:[['accessibility','Aa','언어 및 접근성','앱 언어와 화면 표시 설정'],['help','?','도움말','자주 묻는 질문 및 문제 신고'],['about','ⓘ','정보','약관 및 개인정보 안내']]}];function openSettings(){settingsView='root';document.querySelector('#settingsRoot').style.display='block';document.querySelector('#settingsDetail').style.display='none';document.querySelector('#settingsTitle').textContent='설정 및 활동';nav('settings')}function settingsBack(){if(settingsView==='detail'){settingsView='root';document.querySelector('#settingsRoot').style.display='block';document.querySelector('#settingsDetail').style.display='none';document.querySelector('#settingsTitle').textContent='설정 및 활동'}else nav('profile')}function openSettingPage(key){settingsView='detail';let names={account:'계정 센터',privacy:'개인정보 보호',security:'보안',notifications:'알림',activity:'보관 및 활동',preferences:'콘텐츠 환경설정',accessibility:'언어 및 접근성',help:'도움말',about:'정보'};document.querySelector('#settingsRoot').style.display='none';document.querySelector('#settingsDetail').style.display='block';document.querySelector('#settingsTitle').textContent=names[key];document.querySelector('#settingsDetail').innerHTML=settingDetail(key)}function settingAction(icon,label,desc,action){return `<button class="setting-row" data-setting-action="${action}"><span class="setting-icon">${icon}</span><span class="setting-copy"><span class="setting-label">${label}</span><span class="setting-desc">${desc}</span></span><span class="setting-chevron">›</span></button>`}function renderSettingsRoot(){let root=document.querySelector('#settingsRoot');root.innerHTML=`<button class="account-center" data-open-setting="account"><div class="ac-brand">◉　계정 센터</div><p>계정과 연결 경험을 한곳에서 관리하세요. 개인정보와 보안 설정을 확인할 수 있어요.</p><b>계정 센터에서 더 보기　›</b></button>${settingsGroups.map(g=>`<div class="settings-group"><h3>${g.title}</h3>${g.items.map(x=>`<button class="setting-row" data-open-setting="${x[0]}"><span class="setting-icon">${x[1]}</span><span class="setting-copy"><span class="setting-label">${x[2]}</span><span class="setting-desc">${x[3]}</span></span><span class="setting-chevron">›</span></button>`).join('')}</div>`).join('')}<div class="settings-foot">MOAFANS · 버전 1.0.0</div>`;root.querySelectorAll('[data-open-setting]').forEach(button=>button.addEventListener('click',()=>openSettingPage(button.dataset.openSetting)))}function switchOption(key,label,description,defaultOn=false){let on=localStorage.getItem('moa-setting-'+key);if(on===null)on=defaultOn?'true':'false';return `<div class="setting-option"><div class="setting-option-copy"><strong>${label}</strong><small>${description}</small></div><button class="setting-toggle ${on==='true'?'on':''}" data-toggle-key="${key}" aria-label="${label} 설정" aria-pressed="${on==='true'}"><i></i></button></div>`}function toggleSetting(key,button){let on=!button.classList.contains('on');button.classList.toggle('on',on);button.setAttribute('aria-pressed',String(on));localStorage.setItem('moa-setting-'+key,String(on));toast(on?'설정을 켰어요':'설정을 껐어요')}function bindSettingDetail(){document.querySelectorAll('#settingsDetail [data-toggle-key]').forEach(button=>button.addEventListener('click',()=>toggleSetting(button.dataset.toggleKey,button)));document.querySelectorAll('#settingsDetail [data-setting-action]').forEach(button=>button.addEventListener('click',()=>handleSettingAction(button.dataset.settingAction)));let select=document.querySelector('#settingsDetail select');if(select)select.addEventListener('change',()=>toast('언어 설정을 저장했어요'))}function handleSettingAction(action){let messages={password:'비밀번호 변경은 계정 인증 연결 후 사용할 수 있어요',archive:'보관함이 비어 있어요',activity:'최근 활동을 불러왔어요',help:'도움말 센터는 준비 중이에요',contact:'문의 기능은 준비 중이에요',terms:'이용 약관을 준비 중이에요',policy:'개인정보 안내를 준비 중이에요'};toast(messages[action]||'설정을 불러왔어요')}function settingDetail(key){let intro='',opts='';if(key==='account'){intro='MOAFANS 계정과 연결된 로그인 및 개인정보를 관리합니다.';opts=switchOption('login-sharing','계정 간 로그인','연결된 계정으로 빠르게 로그인할 수 있어요.')+switchOption('profile-sync','프로필 정보 동기화','이름과 프로필 사진을 연결된 계정에 함께 적용해요.')}else if(key==='privacy'){intro='내 게시물과 활동을 누가 볼 수 있는지 설정합니다.';opts=switchOption('private-account','비공개 계정','승인한 팔로워만 게시물과 사진을 볼 수 있어요.')+switchOption('activity-status','활동 상태 표시','내가 활동 중인지 팔로워에게 표시합니다.',true)+switchOption('mention-control','멘션 알림 받기','다른 사람이 나를 언급하면 알려드려요.',true)}else if(key==='security'){intro='계정에 안전하게 로그인할 수 있도록 보호 설정을 관리합니다.';opts=switchOption('login-alert','로그인 알림','새로운 기기에서 로그인하면 알려드려요.',true)+switchOption('two-factor','2단계 인증','추가 인증으로 계정을 보호합니다.')+settingAction('🔑','비밀번호 변경','계정 인증을 연결해 안전하게 변경하세요','password')}else if(key==='notifications'){intro='받고 싶은 알림을 선택하세요. 변경 사항은 이 브라우저에 저장됩니다.';opts=switchOption('pause-notifications','모든 알림 일시 중지','알림을 잠시 쉬고 싶을 때 켜세요.')+switchOption('like-notifications','좋아요 및 댓글','내 게시물 반응을 알려드려요.',true)+switchOption('follow-notifications','팔로우 및 친구','새 팔로워와 추천 친구를 알려드려요.',true)+switchOption('community-notifications','커뮤니티 소식','참여 중인 커뮤니티의 새 대화를 알려드려요.',true)}else if(key==='activity'){intro='내가 올린 콘텐츠와 앱 사용 기록을 확인하고 관리합니다.';opts=settingAction('▣','보관함','보관한 게시물과 스토리','archive')+settingAction('◷','내 활동','좋아요, 댓글, 검색 기록','activity')+switchOption('save-originals','원본 사진 저장','게시한 사진을 기기에도 보관합니다.')}else if(key==='preferences'){intro='피드와 탐색에서 보고 싶은 콘텐츠를 조정합니다.';opts=switchOption('suggested-posts','관심사 기반 추천','내가 좋아할 만한 게시물을 추천합니다.',true)+switchOption('sensitive-content','민감한 콘텐츠 줄이기','탐색 화면에 표시되는 민감한 콘텐츠를 줄입니다.')+switchOption('autoplay-video','영상 자동 재생','피드의 영상 미리보기를 자동 재생합니다.',true)+switchOption('hide-words','숨길 단어 필터','불쾌한 단어가 포함된 댓글을 숨깁니다.')}else if(key==='accessibility'){intro='앱을 편하게 이용할 수 있도록 표시와 언어를 설정합니다.';opts='<div class="setting-option"><div class="setting-option-copy"><strong>앱 언어</strong><small>화면에 표시할 언어를 선택하세요.</small></div><select class="settings-select"><option>한국어</option><option>English</option><option>日本語</option></select></div>'+switchOption('reduce-motion','동작 줄이기','화면 전환 애니메이션을 줄입니다.')+switchOption('bold-text','굵은 글씨','텍스트 가독성을 높입니다.')+'<div class="settings-foot">기기에서 글자 크기를 조절하면 앱 화면에도 반영됩니다.</div>'}else if(key==='help'){intro='MOAFANS를 사용하며 도움이 필요한가요?';opts=settingAction('?','도움말 센터','자주 묻는 질문과 사용 안내','help')+settingAction('✉','문제 신고 및 문의','앱에 관한 의견을 보내주세요','contact')}else{intro='MOAFANS 프로토타입 및 서비스 정책 정보입니다.';opts=settingAction('▤','이용 약관','서비스 이용에 관한 안내','terms')+settingAction('🔒','개인정보 처리 안내','데이터 처리 방식 안내','policy')}return `<p class="detail-intro">${intro}</p>${opts}`}function openSettingPage(key){settingsView='detail';let names={account:'계정 센터',privacy:'개인정보 보호',security:'보안',notifications:'알림',activity:'보관 및 활동',preferences:'콘텐츠 환경설정',accessibility:'언어 및 접근성',help:'도움말',about:'정보'};document.querySelector('#settingsRoot').style.display='none';let detail=document.querySelector('#settingsDetail');detail.style.display='block';document.querySelector('#settingsTitle').textContent=names[key];detail.innerHTML=settingDetail(key);bindSettingDetail()}function openSettings(){settingsView='root';document.querySelector('#settingsRoot').style.display='block';document.querySelector('#settingsDetail').style.display='none';document.querySelector('#settingsTitle').textContent='설정 및 활동';nav('settings')}function settingsBack(){if(settingsView==='detail'){settingsView='root';document.querySelector('#settingsRoot').style.display='block';document.querySelector('#settingsDetail').style.display='none';document.querySelector('#settingsTitle').textContent='설정 및 활동'}else nav('profile')}renderSettingsRoot();let timer;function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2100)}document.querySelectorAll('.nav [data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));renderFeed(b.dataset.feed)});document.querySelectorAll('.community-chips .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.community-chips .chip').forEach(c=>c.classList.toggle('on',c===b));renderCommunities(b.dataset.community)});document.querySelector('#notices').innerHTML=people.slice(0,4).map((p,i)=>`<div class="notice"><img class="avatar" src="${p[2]}"><div><strong>${p[0]}</strong>님이 회원님의 이야기를 좋아합니다. ${['햇살 좋은 오후의 기록','오늘의 작은 행복','주말 산책','커피 한 잔'][i]}<small>${i+2}시간 전</small></div></div>`).join('');renderStories();renderFeed();renderCommunities();renderGrid(document.querySelector('#exploreGrid'));renderGrid(document.querySelector('#profileGrid'));
</script></body></html>
